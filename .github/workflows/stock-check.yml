name: PS5 Pro stock check

on:
  schedule:
    - cron: "*/5 * * * *"  # GitHub's minimum; actual runs are often delayed a few minutes
  workflow_dispatch:
    inputs:
      test_notify:
        description: "Send a test notification (ntfy, plus email if configured) instead of checking stock"
        type: boolean
        default: false

concurrency:
  group: stock-check

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
      SMTP_PORT: ${{ secrets.SMTP_PORT || '465' }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      ALERT_TO: ${{ secrets.ALERT_TO }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - uses: actions/checkout@v4

      - name: Send test notification
        if: ${{ inputs.test_notify }}
        run: python3 stock_alert.py --test

      # state.json carries alert/failure history between runs so you aren't spammed.
      - name: Restore state
        if: ${{ !inputs.test_notify }}
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: stock-state-${{ github.run_id }}
          restore-keys: stock-state-

      # Check every 60s for ~4 min so coverage stays near-continuous between scheduled runs.
      - name: Check stock
        if: ${{ !inputs.test_notify }}
        run: python3 stock_alert.py --loop 60 --count 5

      - name: Save state
        if: ${{ !inputs.test_notify && always() }}
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: stock-state-${{ github.run_id }}
